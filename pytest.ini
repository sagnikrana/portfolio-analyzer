[pytest]
testpaths = tests
; Default run is the fast, offline unit suite. The slow, network-backed
; end-to-end test is opt-in:  pytest -m integration  (or pytest -m "").
addopts = -q --strict-markers -m "not integration"
filterwarnings =
    ignore
markers =
    integration: end-to-end test that runs the real analysis pipeline (needs
        network / yfinance); skipped gracefully when data can't be fetched.
